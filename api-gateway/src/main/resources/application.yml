server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:3000"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            exposed-headers: "Authorization"
            allow-credentials: true
            max-age: 3600

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# JWT Configuration
jwt:
  secret: english-lms-jwt-secret-key-must-be-at-least-256-bits-long-for-security

# Open endpoints (no JWT required)
gateway:
  open-endpoints:
    - /api/v1/auth/register
    - /api/v1/auth/login
    - /api/v1/courses
    - /api/v1/courses/**
    - /user/auth/**
    - /user/login
    - /user/register
    - /course/public/**
    - /eureka/**
    - /actuator/**

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.englishlms.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
