name: Backend CI Pipeline

on:
  push:
    branches: [ main, master, develop, 'feature/**' ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  maven-test:
    name: Build & Test Backend Microservices
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Test Multi-module Project
        run: mvn -B clean test
        env:
          JWT_SECRET: english-lms-jwt-secret-key-must-be-at-least-256-bits-long-for-security
          GEMINI_API_KEY: placeholder_gemini_key_for_testing
