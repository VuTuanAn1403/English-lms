name: Frontend CI Pipeline

on:
  push:
    branches: [ main, master, develop, 'feature/**' ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Frontend Install, Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies cleanly
        run: npm ci

      - name: Check Linting
        run: npm run lint
        continue-on-error: true

      - name: Build Production Vite Bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.english-lms.example.com
          VITE_APP_NAME: English LMS

      - name: Verify output directory
        run: |
          test -d dist
          test -f dist/index.html
          echo "Frontend Vite build artifact verified successfully!"
