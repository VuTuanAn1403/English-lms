server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "https://*.vercel.app"
              - "http://localhost:[*]"
              - "http://127.0.0.1:[*]"
              - "${CORS_ALLOWED_ORIGIN_PATTERNS:*}"
            allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            exposed-headers: "Authorization"
            allow-credentials: true
            max-age: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:english-lms-jwt-secret-key-must-be-at-least-256-bits-long-for-security}

gateway:
  open-endpoints: "/api/v1/auth/register,/api/v1/auth/login,/api/v1/courses,/api/v1/courses/**,/api/v1/lessons,/api/v1/lessons/**,/api/v1/payments/vnpay/**,/user/auth/**,/user/login,/user/register,/course/public/**,/eureka/**,/actuator/**"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.englishlms.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
